plugin: community.docker.docker_containers

docker_host: unix:///var/run/docker.sock
connection_type: docker-api

keyed_groups:
  - key: docker_config.Labels['lab.role']
    prefix: role
    separator: "_"

compose:
  docker_labels: docker_config.Labels

filters:
  - include: >-
      "lab.env" in docker_config.Labels
  - exclude: true