---
- name: Apply baseline configuration to every node
  hosts: all
  become: true
  roles:
    - role: common
      tags: baseline

- name: Configure the web tier
  hosts: role_web
  become: true
  roles:
    - role: nginx
      tags: web

- name: Configure the load balancer
  hosts: role_lb
  become: true
  roles:
    - role: haproxy
      tags: lb

- name: Configure the db tier
  hosts: role_db
  become: true
  roles:
    - role: db_stub
      tags: db