---
- name: Apply baseline configuration to every node
  hosts: all
  become: true
  roles:
    - common

- name: Configure the web tier
  hosts: role_web
  become: true
  roles:
    - nginx

- name: Configure the load balancer
  hosts: role_lb
  become: true
  roles:
    - haproxy

- name: Configure the db tier
  hosts: role_db
  become: true
  roles:
    - db_stub